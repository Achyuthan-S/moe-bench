[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-bench"
version = "0.1.0"
description = "Open benchmark for expert collapse and routing efficiency in sparse MoE LLMs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "MoE-Bench Contributors" }]
keywords = ["moe", "mixture-of-experts", "routing", "benchmark", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "accelerate>=0.27.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
quantize = ["bitsandbytes>=0.43.0"]
train = ["peft>=0.10.0", "safetensors>=0.4.0", "wandb>=0.16.0"]
eval = ["lm-eval>=0.4.0", "safetensors>=0.4.0"]
demo = ["gradio>=4.0.0", "pillow>=10.0.0"]
dev = ["pytest>=8.0.0", "build>=1.0.0", "twine>=5.0.0", "mkdocs>=1.5.0", "mkdocs-material>=9.0.0"]
all = ["moe-bench[quantize,train,eval,demo,dev]"]

[project.scripts]
moe-bench = "moe_bench.cli:main"

[project.urls]
# Set Homepage and Repository to your GitHub URL when you publish (placeholder URLs removed).

[tool.setuptools.packages.find]
where = ["."]
include = ["moe_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
